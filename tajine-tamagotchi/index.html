<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Тажин Тамагочи</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="phone-frame">
    <!-- Экран меню -->
    <div id="screen-menu" class="screen active">
        <div class="menu-container">
            <div class="menu-pattern"></div>
            <h1 class="game-title">تاجين</h1>
            <h2 class="game-subtitle">Тажин Тамагочи</h2>
            <div class="tajine-logo">
                <div class="tajine-lid-logo"></div>
                <div class="tajine-base-logo"></div>
            </div>
            <button class="btn btn-primary" onclick="game.showRecipeSelect()">Начать готовку</button>
            <button class="btn btn-secondary" onclick="game.showCollection()">Коллекция</button>
        </div>
    </div>

    <!-- Экран выбора рецепта -->
    <div id="screen-recipes" class="screen">
        <div class="screen-header">
            <button class="btn-back" onclick="game.showMenu()">&#8592;</button>
            <h2>Выбери рецепт</h2>
        </div>
        <div class="recipes-list" id="recipes-list">
            <!-- Рецепты заполняются через JS -->
        </div>
    </div>

    <!-- Основной экран игры -->
    <div id="screen-game" class="screen">
        <div class="game-header">
            <div class="recipe-name" id="current-recipe-name">Курица с оливками</div>
            <div class="timer" id="game-timer">0:00</div>
        </div>

        <!-- Визуализация тажина -->
        <div class="tajine-container">
            <div class="steam-container" id="steam-container">
                <div class="steam steam-1"></div>
                <div class="steam steam-2"></div>
                <div class="steam steam-3"></div>
            </div>
            <div class="tajine">
                <div class="tajine-lid" id="tajine-lid">
                    <div class="tajine-knob"></div>
                </div>
                <div class="tajine-base" id="tajine-base">
                    <div class="tajine-food" id="tajine-food"></div>
                </div>
            </div>
            <div class="fire-container" id="fire-container">
                <div class="fire-particle fire-1"></div>
                <div class="fire-particle fire-2"></div>
                <div class="fire-particle fire-3"></div>
                <div class="coal"></div>
            </div>
        </div>

        <!-- Шкалы параметров -->
        <div class="stats-container">
            <div class="stat-bar">
                <span class="stat-icon">🔥</span>
                <div class="stat-track">
                    <div class="stat-zone" style="left:40%;width:30%"></div>
                    <div class="stat-fill stat-heat" id="bar-heat"></div>
                </div>
                <span class="stat-value" id="val-heat">50</span>
            </div>
            <div class="stat-bar">
                <span class="stat-icon">💧</span>
                <div class="stat-track">
                    <div class="stat-zone" style="left:30%;width:30%"></div>
                    <div class="stat-fill stat-moisture" id="bar-moisture"></div>
                </div>
                <span class="stat-value" id="val-moisture">50</span>
            </div>
            <div class="stat-bar">
                <span class="stat-icon">🌶️</span>
                <div class="stat-track">
                    <div class="stat-zone" style="left:50%;width:30%"></div>
                    <div class="stat-fill stat-flavor" id="bar-flavor"></div>
                </div>
                <span class="stat-value" id="val-flavor">0</span>
            </div>
            <div class="stat-bar">
                <span class="stat-icon">✅</span>
                <div class="stat-track">
                    <div class="stat-fill stat-doneness" id="bar-doneness"></div>
                </div>
                <span class="stat-value" id="val-doneness">0%</span>
            </div>
        </div>

        <!-- Кнопки действий -->
        <div class="actions-container">
            <button class="action-btn" id="btn-fire" onclick="game.addFire()">
                <span class="action-icon">🔥</span>
                <span class="action-label">Огонь</span>
            </button>
            <button class="action-btn" id="btn-water" onclick="game.addWater()">
                <span class="action-icon">💧</span>
                <span class="action-label">Вода</span>
            </button>
            <button class="action-btn" id="btn-spice" onclick="game.addSpice()">
                <span class="action-icon">🌶️</span>
                <span class="action-label">Специи</span>
            </button>
            <button class="action-btn" id="btn-stir" onclick="game.stir()">
                <span class="action-icon">🥄</span>
                <span class="action-label">Мешать</span>
            </button>
        </div>

        <!-- Сообщение-подсказка -->
        <div class="message-container" id="message-container">
            <p id="game-message"></p>
        </div>
    </div>

    <!-- Экран результата -->
    <div id="screen-result" class="screen">
        <div class="result-container">
            <h2 id="result-title">Блюдо готово!</h2>
            <div class="result-tajine">
                <div class="tajine-base-logo result-dish"></div>
            </div>
            <div class="stars-container" id="stars-container"></div>
            <div class="result-stats" id="result-stats"></div>
            <div class="result-comment" id="result-comment"></div>
            <button class="btn btn-primary" onclick="game.showRecipeSelect()">Готовить ещё</button>
            <button class="btn btn-secondary" onclick="game.showMenu()">В меню</button>
        </div>
    </div>

    <!-- Экран коллекции -->
    <div id="screen-collection" class="screen">
        <div class="screen-header">
            <button class="btn-back" onclick="game.showMenu()">&#8592;</button>
            <h2>Моя коллекция</h2>
        </div>
        <div class="collection-container" id="collection-container">
            <!-- Заполняется через JS -->
        </div>
    </div>

</div><!-- /phone-frame -->
    <script src="game.js"></script>
</body>
</html>
