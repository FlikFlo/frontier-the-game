<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Уличный повар</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="phone-frame">
    <div class="particles-layer" id="particles-layer"></div>

    <!-- ========== СТАРТОВЫЙ ЭКРАН ========== -->
    <div id="screen-start" class="screen active">
        <div class="start-bg"></div>
        <div class="start-content">
            <h1 class="big-title">الطباخ</h1>
            <h2 class="subtitle">Уличный повар</h2>
            <p class="tagline">Марокко ждёт своего шефа</p>
            <button class="btn btn-primary btn-glow" onclick="game.startNewOrContinue()">
                <span id="start-btn-text">Начать</span>
            </button>
            <button class="btn btn-ghost" onclick="game.resetSave()" id="reset-btn" style="display:none;">Начать заново</button>
        </div>
    </div>

    <!-- ========== СОЗДАНИЕ ПЕРСОНАЖА ========== -->
    <div id="screen-create" class="screen">
        <div class="screen-header">
            <h2>Твой шеф</h2>
        </div>
        <div class="create-body">
            <div class="character-preview" id="char-preview">
                <div class="char-body">
                    <div class="char-head">
                        <div class="char-hat" id="char-hat">🎩</div>
                        <div class="char-face" id="char-face"></div>
                        <div class="char-beard" id="char-beard"></div>
                    </div>
                    <div class="char-torso" id="char-torso"></div>
                </div>
            </div>

            <div class="create-row">
                <label>Лицо</label>
                <div class="picker" id="picker-face"></div>
            </div>
            <div class="create-row">
                <label>Борода</label>
                <div class="picker" id="picker-beard"></div>
            </div>
            <div class="create-row">
                <label>Фартук</label>
                <div class="picker" id="picker-apron"></div>
            </div>
            <div class="create-row">
                <label>Имя</label>
                <input type="text" id="char-name" maxlength="12" placeholder="Хасан" />
            </div>
            <div class="create-row trait-row">
                <label>Специализация</label>
                <div class="traits" id="traits-picker"></div>
            </div>

            <button class="btn btn-primary btn-glow" onclick="game.finishCreation()">В палатку! →</button>
        </div>
    </div>

    <!-- ========== ХАБ ========== -->
    <div id="screen-hub" class="screen">
        <div class="hub-top">
            <div class="hub-character" onclick="game.showWardrobe()">
                <div class="hub-char-mini" id="hub-char-mini"></div>
                <div class="hub-name" id="hub-name">Шеф</div>
            </div>
            <div class="hub-stats">
                <div class="hub-stat"><span>🪙</span><span id="hub-coins">0</span></div>
                <div class="hub-stat"><span>💎</span><span id="hub-gems">0</span></div>
                <div class="hub-stat"><span>⭐</span><span id="hub-rep">0</span></div>
            </div>
        </div>

        <div class="hub-location">
            <div class="location-title">Марракеш</div>
            <div class="location-sub">Джемаа-эль-Фна · день <span id="hub-day">1</span></div>
            <div class="stall-preview" id="stall-preview">
                <!-- Превью палатки -->
            </div>
        </div>

        <div class="hub-actions">
            <button class="btn btn-primary btn-glow big-btn" onclick="game.startDay()">
                🍲 Открыть палатку
            </button>
            <div class="hub-row">
                <button class="btn btn-square" onclick="game.showUpgrades()">
                    <span>🔧</span><span>Апгрейды</span>
                </button>
                <button class="btn btn-square" onclick="game.showWardrobe()">
                    <span>👔</span><span>Гардероб</span>
                </button>
                <button class="btn btn-square" onclick="game.showCollection()">
                    <span>📖</span><span>Рецепты</span>
                </button>
            </div>
        </div>
    </div>

    <!-- ========== ИГРА (ПАЛАТКА) ========== -->
    <div id="screen-game" class="screen">
        <div class="game-top">
            <div class="top-coins"><span>🪙</span><span id="game-coins">0</span></div>
            <div class="day-timer-bar">
                <div class="day-timer-fill" id="day-timer-fill"></div>
                <div class="day-timer-text" id="day-timer-text">60с</div>
            </div>
            <div class="top-rep"><span>⭐</span><span id="game-rep">0</span></div>
        </div>

        <!-- Сцена -->
        <div class="scene" id="scene">
            <div class="scene-sky"></div>
            <div class="scene-wall"></div>
            <div class="scene-ground"></div>

            <!-- Палатка с поваром -->
            <div class="stall" id="stall">
                <div class="stall-roof"></div>
                <div class="stall-sign" id="stall-sign">Тажин</div>
                <div class="stall-counter"></div>
                <div class="chef" id="chef">
                    <div class="chef-body">
                        <div class="chef-head">
                            <div class="chef-hat" id="chef-hat">🎩</div>
                            <div class="chef-face" id="chef-face"></div>
                            <div class="chef-beard" id="chef-beard"></div>
                        </div>
                        <div class="chef-torso" id="chef-torso"></div>
                        <div class="chef-arm chef-arm-l"></div>
                        <div class="chef-arm chef-arm-r" id="chef-arm-r"></div>
                    </div>
                </div>
                <div class="stall-fire" id="stall-fire">🔥</div>
                <div class="stall-tajine">
                    <div class="mini-tajine-lid"></div>
                    <div class="mini-tajine-base"></div>
                </div>
            </div>

            <!-- Очередь клиентов -->
            <div class="queue" id="queue"></div>

            <!-- Мини-игра готовки (поверх) -->
            <div class="cook-overlay" id="cook-overlay">
                <div class="cook-order">
                    <div class="cook-order-icon" id="cook-order-icon">🍲</div>
                    <div class="cook-order-name" id="cook-order-name">Тажин</div>
                </div>
                <div class="cook-ingredients" id="cook-ingredients"></div>
                <div class="cook-progress-wrap">
                    <div class="cook-progress-zone"></div>
                    <div class="cook-progress-fill" id="cook-progress-fill"></div>
                    <div class="cook-progress-marker" id="cook-progress-marker"></div>
                </div>
                <button class="btn btn-primary btn-big" id="cook-serve-btn" onclick="game.serveDish()">
                    Подать!
                </button>
            </div>
        </div>

        <!-- Сообщение -->
        <div class="message-container" id="message-container">
            <p id="game-message"></p>
        </div>
    </div>

    <!-- ========== КОНЕЦ ДНЯ ========== -->
    <div id="screen-day-end" class="screen">
        <div class="day-end-container">
            <h2 id="day-end-title">День завершён!</h2>
            <div class="day-summary" id="day-summary">
                <div class="summary-row"><span>Обслужено</span><span id="sum-served">0</span></div>
                <div class="summary-row"><span>Пропущено</span><span id="sum-lost">0</span></div>
                <div class="summary-row"><span>Заработано</span><span class="gold">🪙 <span id="sum-coins">0</span></span></div>
                <div class="summary-row"><span>Репутация</span><span class="stars">⭐ +<span id="sum-rep">0</span></span></div>
                <div class="summary-row"><span>Чаевые</span><span class="gold">🪙 <span id="sum-tips">0</span></span></div>
            </div>
            <div class="day-end-total">
                <span>Итого</span>
                <span class="gold-big">🪙 <span id="sum-total">0</span></span>
            </div>
            <button class="btn btn-primary btn-glow" onclick="game.endDayReturn()">В хаб</button>
        </div>
    </div>

    <!-- ========== АПГРЕЙДЫ ========== -->
    <div id="screen-upgrades" class="screen">
        <div class="screen-header">
            <button class="btn-back" onclick="game.showHub()">&#8592;</button>
            <h2>Апгрейды палатки</h2>
            <div class="header-coins"><span>🪙</span><span id="up-coins">0</span></div>
        </div>
        <div class="upgrade-branches" id="upgrade-branches"></div>
    </div>

    <!-- ========== ГАРДЕРОБ ========== -->
    <div id="screen-wardrobe" class="screen">
        <div class="screen-header">
            <button class="btn-back" onclick="game.showHub()">&#8592;</button>
            <h2>Гардероб</h2>
        </div>
        <div class="wardrobe-preview" id="wardrobe-preview"></div>
        <div class="wardrobe-tabs">
            <button class="ward-tab active" onclick="game.showWardrobeTab('apron')">Фартук</button>
            <button class="ward-tab" onclick="game.showWardrobeTab('hat')">Шапка</button>
            <button class="ward-tab" onclick="game.showWardrobeTab('beard')">Борода</button>
        </div>
        <div class="wardrobe-items" id="wardrobe-items"></div>
    </div>

    <!-- ========== КОЛЛЕКЦИЯ ========== -->
    <div id="screen-collection" class="screen">
        <div class="screen-header">
            <button class="btn-back" onclick="game.showHub()">&#8592;</button>
            <h2>Рецепты</h2>
        </div>
        <div class="collection-list" id="collection-list"></div>
    </div>

    <!-- ========== Level Up Popup ========== -->
    <div id="popup-levelup" class="popup-overlay">
        <div class="popup-card levelup-card">
            <div class="levelup-badge">🎉</div>
            <h2>Репутация <span id="levelup-num">5</span>!</h2>
            <div class="levelup-unlock" id="levelup-unlock"></div>
            <button class="btn btn-primary" onclick="game.closeLevelUp()">Супер!</button>
        </div>
    </div>

</div>
<script src="game.js"></script>
</body>
</html>
